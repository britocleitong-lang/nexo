# Publica o Nexo no GitHub Pages a cada envio para a branch principal.
#
# A variável BASE precisa bater com o nome do repositório. Se o seu
# repositório se chamar "meu-nexo", troque abaixo para /meu-nexo/.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # A partir da v4, a deploy-pages lê o artefato pela API de artifacts e
  # precisa desta permissão. Sem ela, a publicação falha no último passo.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Gerar o site
        env:
          BASE: /nexo/
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Liga o GitHub Pages sozinho se ainda não estiver ligado.
          #
          # Sem isto, a primeira execução falha com "Get Pages site failed
          # ... Not Found" — um erro confuso, porque ele não diz que o
          # problema é ordem: o workflow rodou antes de alguém marcar
          # "GitHub Actions" como origem nas configurações. Com enablement,
          # a própria action configura e o repositório se resolve na
          # primeira vez, sem passo manual.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
